<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Epistle — Composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
textarea{outline:none}
button{outline:none}
@keyframes inkDraw{0%{stroke-dashoffset:1;opacity:1}55%{stroke-dashoffset:0;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F4EC;font-family:'Work Sans',system-ui,sans-serif;color:#1C1A17;overflow:hidden;position:relative;display:flex;flex-direction:column;">

<sc-if value="{{screenSetup}}" hint-placeholder-val="{{true}}">
<div style="width:100%;height:100%;display:flex;flex-direction:column;box-sizing:border-box;">
  <div style="display:flex;align-items:center;padding:20px 24px 0;flex-shrink:0;">
    <div style="font-family:'Source Serif 4',Georgia,serif;font-size:22px;font-weight:600;">epistle.</div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;padding:14px 24px 0;min-height:0;overflow-y:auto;">
    <h1 style="font-family:'Source Serif 4',Georgia,serif;font-size:30px;line-height:1.2;font-weight:600;margin:6px 0 18px;flex-shrink:0;white-space:nowrap;">What's on your mind?</h1>

    <div style="border-top:1px solid #E4DFD2;flex:1;display:flex;flex-direction:column;margin-bottom:16px;">
      <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #E4DFD2;">
        <div style="width:64px;flex-shrink:0;font-size:14px;color:#6B655C;line-height:44px;">To</div>
        <div style="flex:1;display:flex;flex-wrap:wrap;gap:8px;min-width:0;align-items:center;">
          <sc-for list="{{recipientItems}}" as="item" hint-placeholder-count="4">
            <button type="button" onClick="{{item.pick}}" style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid {{item.borderColor}};background:{{item.bg}};color:{{item.fg}};font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;">{{item.label}}</button>
          </sc-for>
          <button type="button" onClick="{{toggleMoreRecipients}}" style="min-height:44px;padding:0 8px;border:none;background:none;color:#6B655C;font-family:inherit;font-size:14px;cursor:pointer;">{{moreRecipientsLabel}}</button>
        </div>
      </div>
      <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #E4DFD2;">
        <div style="width:64px;flex-shrink:0;font-size:14px;color:#6B655C;line-height:44px;">Tone</div>
        <div style="flex:1;display:flex;flex-wrap:wrap;gap:8px;min-width:0;align-items:center;">
          <sc-for list="{{toneItems}}" as="item" hint-placeholder-count="4">
            <button type="button" onClick="{{item.pick}}" style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid {{item.borderColor}};background:{{item.bg}};color:{{item.fg}};font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;">{{item.label}}</button>
          </sc-for>
          <button type="button" onClick="{{toggleMoreTones}}" style="min-height:44px;padding:0 8px;border:none;background:none;color:#6B655C;font-family:inherit;font-size:14px;cursor:pointer;">{{moreTonesLabel}}</button>
        </div>
      </div>
      <div style="flex:1;display:flex;gap:12px;padding:12px 0;min-height:220px;">
        <label for="details" style="width:64px;flex-shrink:0;font-size:14px;color:#6B655C;line-height:44px;">Message</label>
        <div style="flex:1;position:relative;display:flex;min-width:0;background:#FFFFFF;border:1px solid #E4DFD2;border-radius:20px;">
          <textarea id="details" value="{{details}}" onChange="{{handleDetailsChange}}" placeholder="What do you want to say? A few rough lines are plenty." style="flex:1;width:100%;box-sizing:border-box;padding:16px 18px 38px;border:none;border-radius:20px;background:transparent;resize:none;font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.55;color:#1C1A17;"></textarea>
          <div style="position:absolute;right:16px;bottom:12px;font-size:12px;color:{{detailsCounterColor}};">{{detailsCount}} / 500</div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding:14px 24px 22px;background:#F7F4EC;flex-shrink:0;">
    <button type="button" onClick="{{handleGenerate}}" disabled="{{isNotReady}}" style="width:100%;min-height:52px;border-radius:999px;border:none;background:#1C1A17;color:#F7F4EC;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;opacity:{{generateOpacity}};pointer-events:{{generatePointerEvents}};">Generate letter</button>
  </div>
</div>
</sc-if>

<sc-if value="{{screenGenerating}}" hint-placeholder-val="{{false}}">
<div style="width:100%;height:100%;display:flex;flex-direction:column;box-sizing:border-box;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:28px;">
    <div style="width:270px;background:#FFFFFF;border:1px solid #E4DFD2;border-radius:20px;padding:26px 24px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;">
      <svg width="222" height="28" viewBox="0 0 222 28" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M2 14 q9 -20 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:inkDraw 3s ease-in-out infinite;animation-delay:0s;"></path></svg>
      <svg width="222" height="28" viewBox="0 0 222 28" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M2 14 q9 -20 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:inkDraw 3s ease-in-out infinite;animation-delay:0.5s;"></path></svg>
      <svg width="222" height="28" viewBox="0 0 222 28" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M2 14 q9 -20 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:inkDraw 3s ease-in-out infinite;animation-delay:1s;"></path></svg>
      <svg width="222" height="28" viewBox="0 0 222 28" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M2 14 q9 -20 18 0 t18 0 t18 0 t18 0 t18 0 t18 0" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:inkDraw 3s ease-in-out infinite;animation-delay:1.5s;"></path></svg>
    </div>
    <div style="text-align:center;font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.4;color:#1C1A17;max-width:260px;">{{generatingText}}</div>
  </div>
  <div style="padding:14px 24px 22px;flex-shrink:0;">
    <button type="button" onClick="{{goBackToSetup}}" style="width:100%;min-height:48px;border-radius:999px;border:1px solid #E4DFD2;background:#FFFFFF;color:#1C1A17;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;">Cancel</button>
  </div>
</div>
</sc-if>

<sc-if value="{{screenResult}}" hint-placeholder-val="{{false}}">
<div style="width:100%;height:100%;display:flex;flex-direction:column;box-sizing:border-box;position:relative;">
  <div style="padding:20px 24px 0;flex-shrink:0;">
    <button type="button" onClick="{{goBackToSetup}}" style="display:flex;align-items:center;gap:4px;min-height:44px;background:none;border:none;padding:0;font-family:inherit;font-size:15px;color:#1C1A17;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Edit details
    </button>
  </div>

  <div style="flex:1;overflow-y:auto;padding:4px 24px 16px;position:relative;z-index:5;">
    <div style="position:relative;margin-bottom:12px;">
      <button type="button" onClick="{{toggleToneSwitcher}}" aria-haspopup="listbox" style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid #E4DFD2;background:#FFFFFF;font-family:inherit;font-size:14px;color:#1C1A17;cursor:pointer;box-sizing:border-box;">
        <span style="display:flex;align-items:center;gap:10px;"><span style="color:#6B655C;">Tone</span><span style="font-weight:600;">{{toneName}}</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{toneChevronRotation}}deg);flex-shrink:0;"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <sc-if value="{{toneSwitcherOpen}}" hint-placeholder-val="{{false}}">
        <div style="position:absolute;left:0;right:0;top:56px;z-index:6;display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:#FFFFFF;border:1px solid #E4DFD2;border-radius:24px;box-shadow:0 14px 32px rgba(28,26,23,0.14);box-sizing:border-box;">
          <sc-for list="{{quickToneItems}}" as="item" hint-placeholder-count="8">
            <button type="button" onClick="{{item.pick}}" style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid {{item.borderColor}};background:{{item.bg}};color:{{item.fg}};font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;">{{item.label}}</button>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{editingBool}}" hint-placeholder-val="{{false}}">
      <div style="background:#FFFFFF;border:1px solid #E4DFD2;border-radius:20px;padding:22px;box-sizing:border-box;">
        <textarea value="{{editText}}" onChange="{{handleEditChange}}" aria-label="Edit your letter" style="width:100%;box-sizing:border-box;min-height:300px;border:none;background:transparent;resize:none;font-family:'Source Serif 4',Georgia,serif;font-size:16px;line-height:1.7;color:#1C1A17;"></textarea>
      </div>
    </sc-if>
    <sc-if value="{{notEditingBool}}" hint-placeholder-val="{{true}}">
      <div style="background:#FFFFFF;border:1px solid #E4DFD2;border-radius:20px;padding:22px;box-sizing:border-box;">
        <div style="font-size:12px;color:#6B655C;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:14px;">October 24</div>
        <sc-if value="{{hasCustomText}}" hint-placeholder-val="{{false}}">
          <div style="font-family:'Source Serif 4',Georgia,serif;font-size:16px;line-height:1.7;color:#1C1A17;white-space:pre-wrap;">{{customText}}</div>
        </sc-if>
        <sc-if value="{{noCustomText}}" hint-placeholder-val="{{true}}">
          <div style="font-family:'Source Serif 4',Georgia,serif;">
            <div style="font-size:21px;font-weight:600;margin-bottom:14px;">Dearest,</div>
            <sc-for list="{{letterParagraphs}}" as="para" hint-placeholder-count="3">
              <p style="font-size:16px;line-height:1.7;color:#1C1A17;margin:0 0 16px;">{{para.text}}</p>
            </sc-for>
            <div style="font-size:16px;line-height:1.7;margin-top:6px;">{{signoffText}}<br>Alex</div>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{notEditingBool}}" hint-placeholder-val="{{true}}">
    <div style="display:flex;align-items:center;justify-content:center;margin-top:4px;">
      <button type="button" onClick="{{regeneratePhrasing}}" style="min-height:44px;padding:0 8px;border:none;background:none;color:#6B655C;font-family:inherit;font-size:14px;cursor:pointer;">Try another phrasing</button>
    </div>
    </sc-if>
  </div>

  <sc-if value="{{notEditingBool}}" hint-placeholder-val="{{true}}">
    <div style="display:flex;gap:10px;padding:14px 24px 22px;background:#F7F4EC;flex-shrink:0;">
      <button type="button" onClick="{{handleCopy}}" style="flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:none;background:#1C1A17;color:#F7F4EC;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F4EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copy text
      </button>
      <button type="button" onClick="{{startEdit}}" style="flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid #E4DFD2;background:#FFFFFF;color:#1C1A17;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
        Edit
      </button>
      <button type="button" onClick="{{toggleShare}}" aria-label="Share this letter" style="width:48px;min-height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid #E4DFD2;background:#FFFFFF;cursor:pointer;padding:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      </button>
    </div>
  </sc-if>
  <sc-if value="{{editingBool}}" hint-placeholder-val="{{false}}">
    <div style="display:flex;gap:10px;padding:14px 24px 22px;background:#F7F4EC;flex-shrink:0;">
      <button type="button" onClick="{{cancelEdit}}" style="flex:1;min-height:48px;border-radius:999px;border:1px solid #E4DFD2;background:#FFFFFF;color:#1C1A17;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;">Cancel</button>
      <button type="button" onClick="{{saveEdit}}" style="flex:1;min-height:48px;border-radius:999px;border:none;background:#1C1A17;color:#F7F4EC;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;">Save changes</button>
    </div>
  </sc-if>

  <sc-if value="{{toneSwitcherOpen}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;inset:0;z-index:4;" onClick="{{toggleToneSwitcher}}"></div>
  </sc-if>

  <sc-if value="{{copiedBool}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;z-index:20;left:50%;transform:translateX(-50%);top:24px;background:#1C1A17;color:#F7F4EC;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;">Copied to clipboard</div>
  </sc-if>

  <sc-if value="{{shareOpenBool}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;inset:0;z-index:8;background:rgba(20,19,17,0.4);" onClick="{{closeShare}}"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;z-index:9;background:#FFFFFF;border-radius:28px 28px 0 0;padding:10px 24px 36px;box-sizing:border-box;">
      <div style="width:36px;height:4px;border-radius:999px;background:#E4DFD2;margin:4px auto 14px;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
        <div style="font-family:'Source Serif 4',Georgia,serif;font-size:22px;font-weight:600;">Share letter</div>
        <button type="button" onClick="{{closeShare}}" aria-label="Close" style="width:44px;height:44px;margin-right:-10px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px;">
        <button type="button" onClick="{{closeShare}}" style="display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:none;padding:0;font-family:inherit;font-size:13px;color:#1C1A17;cursor:pointer;">
          <span style="width:64px;height:64px;border-radius:999px;background:#F0ECE0;display:flex;align-items:center;justify-content:center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </span>
          Email
        </button>
        <button type="button" onClick="{{closeShare}}" style="display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:none;padding:0;font-family:inherit;font-size:13px;color:#1C1A17;cursor:pointer;">
          <span style="width:64px;height:64px;border-radius:999px;background:#F0ECE0;display:flex;align-items:center;justify-content:center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          </span>
          Message
        </button>
        <button type="button" onClick="{{closeShare}}" style="display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:none;padding:0;font-family:inherit;font-size:13px;color:#1C1A17;cursor:pointer;">
          <span style="width:64px;height:64px;border-radius:999px;background:#F0ECE0;display:flex;align-items:center;justify-content:center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          </span>
          Save as PDF
        </button>
      </div>
    </div>
  </sc-if>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);

    this.recipients = [
      { id: "spouse", label: "Spouse" },
      { id: "parent", label: "Parent" },
      { id: "colleague", label: "Colleague" },
      { id: "friend", label: "Friend" },
      { id: "sibling", label: "Sibling" },
      { id: "mentor", label: "Mentor" },
      { id: "teacher", label: "Teacher" }
    ];

    this.tones = [
      { id: "gentle", label: "Gentle" },
      { id: "witty", label: "Witty" },
      { id: "formal", label: "Formal" },
      { id: "apologetic", label: "Apologetic" },
      { id: "heartfelt", label: "Heartfelt" },
      { id: "encouraging", label: "Encouraging" },
      { id: "playful", label: "Playful" },
      { id: "direct", label: "Direct" }
    ];

    this.signoffs = {
      gentle: "With all my love,",
      witty: "Yours truly,",
      formal: "Sincerely,",
      apologetic: "With love (and a little humility),"
    };

    this.drafts = {
      gentle: [
        [
          "I wanted to take a quiet moment to say how grateful I am for you. These last few weeks of travel have pulled me away more than I'd like, and through all of it, you've met my absence with so much patience and grace.",
          "This Friday, I'm setting everything aside. No laptops, no early flights, just the two of us and a slow dinner at home. I've missed simply looking at you across the table.",
          "Thank you for holding steady while I catch up to us again."
        ],
        [
          "Some weeks I feel like I'm chasing my own schedule instead of living it, and you've watched me do that with more patience than I deserve.",
          "Friday night is yours. I'm closing the laptop, turning off the notifications, and making us a proper dinner date, just the two of us.",
          "I can't wait to slow down together."
        ]
      ],
      witty: [
        [
          "I wanted to send a little dispatch from the chaotic frontier of my travel schedule. My calendar has looked less like an itinerary and more like a puzzle missing half its pieces, and somehow you've met that with nothing but patience.",
          "To make amends, I'm officially reserving Friday night. No laptops, no sudden departures, just a cozy dinner where I finally get to look at your lovely face instead of another airport screen.",
          "Count down the days with me."
        ],
        [
          "Breaking news from Alex HQ: the road warrior is coming home, and dinner reservations have been made in your honor.",
          "I know I've been more airport lounge than partner lately, and you've handled it with a patience that frankly deserves an award. Friday, I'm making it up to you. Real food, real conversation, zero boarding passes.",
          "Clear your calendar. I already cleared mine."
        ]
      ],
      formal: [
        [
          "I write to express my sincere appreciation for your patience during this especially demanding stretch of travel. I am aware that my schedule has, at times, felt more like an obstacle than a partnership.",
          "In recognition of this, I would like to formally invite you to dinner this Friday evening, an uninterrupted evening free of professional obligations and dedicated entirely to us.",
          "I look forward to it more than I can properly express."
        ],
        [
          "Thank you for your continued patience through what has been an unusually busy season of travel on my part. It has not gone unnoticed.",
          "I would like to set aside this Friday evening for the two of us: a proper dinner, without distraction, as a small gesture of the gratitude I hold for you.",
          "I am very much looking forward to it."
        ]
      ],
      apologetic: [
        [
          "I owe you an apology. My travel schedule has taken over more of our time than it should have, and you've been remarkably patient while I've been mentally half-present at best.",
          "I want to make it right. This Friday, I'm setting aside a full evening just for us: dinner, no interruptions, no excuses.",
          "Thank you for putting up with me lately. I know it hasn't been easy."
        ],
        [
          "I'm sorry for how scattered I've been these past few weeks. Between flights and back-to-back days, I haven't given you the attention you deserve, and you've never once made me feel bad about it, which somehow makes it worse.",
          "Let me start making it up to you Friday night: dinner, just us, and my full attention for once.",
          "I appreciate you more than I've been showing."
        ]
      ]
    };

    this._genTimer = null;
    this._copyTimer = null;

    this.state = {
      screen: "setup",
      recipient: "spouse",
      tone: "witty",
      details: "Tell them I appreciate their patience with my hectic travel schedule lately, and that I can't wait for our cozy dinner date this Friday night.",
      showMoreRecipients: false,
      showMoreTones: false,
      toneSwitcherOpen: false,
      phrasingIndex: 0,
      editing: false,
      editText: "",
      customText: null,
      copied: false,
      shareOpen: false
    };

    this.pickRecipient = this.pickRecipient.bind(this);
    this.toggleMoreRecipients = this.toggleMoreRecipients.bind(this);
    this.pickTone = this.pickTone.bind(this);
    this.toggleMoreTones = this.toggleMoreTones.bind(this);
    this.handleDetailsChange = this.handleDetailsChange.bind(this);
    this.handleGenerate = this.handleGenerate.bind(this);
    this.goBackToSetup = this.goBackToSetup.bind(this);
    this.toggleToneSwitcher = this.toggleToneSwitcher.bind(this);
    this.switchTone = this.switchTone.bind(this);
    this.regeneratePhrasing = this.regeneratePhrasing.bind(this);
    this.startEdit = this.startEdit.bind(this);
    this.handleEditChange = this.handleEditChange.bind(this);
    this.cancelEdit = this.cancelEdit.bind(this);
    this.saveEdit = this.saveEdit.bind(this);
    this.handleCopy = this.handleCopy.bind(this);
    this.toggleShare = this.toggleShare.bind(this);
    this.closeShare = this.closeShare.bind(this);
  }

  pickRecipient(id) { this.setState({ recipient: id }); }
  toggleMoreRecipients() { this.setState(function (s) { return { showMoreRecipients: !s.showMoreRecipients }; }); }
  pickTone(id) { this.setState({ tone: id, phrasingIndex: 0, customText: null }); }
  toggleMoreTones() { this.setState(function (s) { return { showMoreTones: !s.showMoreTones }; }); }
  handleDetailsChange(e) { this.setState({ details: e.target.value }); }
  handleGenerate() {
    if (!this.state.details.trim()) { return; }
    var self = this;
    clearTimeout(this._genTimer);
    this.setState({ screen: "generating" });
    this._genTimer = setTimeout(function () { self.setState({ screen: "result" }); }, 2600);
  }
  goBackToSetup() { clearTimeout(this._genTimer); this.setState({ screen: "setup" }); }
  toggleToneSwitcher() { this.setState(function (s) { return { toneSwitcherOpen: !s.toneSwitcherOpen }; }); }
  switchTone(id) { this.setState({ tone: id, phrasingIndex: 0, customText: null, toneSwitcherOpen: false }); }
  regeneratePhrasing() { this.setState(function (s) { return { phrasingIndex: s.phrasingIndex === 0 ? 1 : 0, customText: null }; }); }
  startEdit() { this.setState({ editing: true, editText: this.getFullLetterText() }); }
  handleEditChange(e) { this.setState({ editText: e.target.value }); }
  cancelEdit() { this.setState({ editing: false }); }
  saveEdit() { this.setState({ editing: false, customText: this.state.editText }); }
  handleCopy() {
    var text = this.getFullLetterText();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); }
    } catch (e) {}
    var self = this;
    clearTimeout(this._copyTimer);
    this.setState({ copied: true });
    this._copyTimer = setTimeout(function () { self.setState({ copied: false }); }, 1800);
  }
  toggleShare() { this.setState(function (s) { return { shareOpen: !s.shareOpen }; }); }
  closeShare() { this.setState({ shareOpen: false }); }

  getCurrentParagraphs() {
    var variants = this.drafts[this.state.tone] || this.drafts.witty;
    var idx = this.state.phrasingIndex % variants.length;
    return variants[idx];
  }
  getFullLetterText() {
    if (this.state.customText) { return this.state.customText; }
    var paras = this.getCurrentParagraphs();
    var signoff = this.signoffs[this.state.tone] || "Yours truly,";
    return "Dearest,\n\n" + paras.join("\n\n") + "\n\n" + signoff + "\nAlex";
  }

  renderVals() {
    var s = this.state;
    var self = this;

    var recipientObj = this.recipients.filter(function (r) { return r.id === s.recipient; })[0] || this.recipients[0];
    var toneObj = this.tones.filter(function (t) { return t.id === s.tone; })[0] || this.tones[1];

    var primaryRecipients = this.recipients.slice(0, 4);
    var visibleRecipients = s.showMoreRecipients ? this.recipients : primaryRecipients;
    var primaryTones = this.tones.slice(0, 4);
    var visibleTones = s.showMoreTones ? this.tones : primaryTones;

    var recipientItems = visibleRecipients.map(function (r) {
      var selected = r.id === s.recipient;
      return {
        id: r.id,
        label: r.label,
        bg: selected ? "#1C1A17" : "#FFFFFF",
        fg: selected ? "#F7F4EC" : "#1C1A17",
        borderColor: selected ? "#1C1A17" : "#E4DFD2",
        pick: function () { self.pickRecipient(r.id); }
      };
    });

    var toneItems = visibleTones.map(function (t) {
      var selected = t.id === s.tone;
      return {
        id: t.id,
        label: t.label,
        bg: selected ? "#1C1A17" : "#FFFFFF",
        fg: selected ? "#F7F4EC" : "#1C1A17",
        borderColor: selected ? "#1C1A17" : "#E4DFD2",
        pick: function () { self.pickTone(t.id); }
      };
    });

    var quickToneItems = this.tones.map(function (t) {
      var selected = t.id === s.tone;
      return {
        id: t.id,
        label: t.label,
        bg: selected ? "#1C1A17" : "#FFFFFF",
        fg: selected ? "#F7F4EC" : "#1C1A17",
        borderColor: selected ? "#1C1A17" : "#E4DFD2",
        pick: function () { self.switchTone(t.id); }
      };
    });

    var detailsLen = s.details.length;
    var hasCustomText = !!s.customText;
    var letterParagraphs = this.getCurrentParagraphs().map(function (text) { return { text: text }; });
    var isNotReady = s.details.trim().length === 0;

    return {
      screenSetup: s.screen === "setup",
      screenGenerating: s.screen === "generating",
      screenResult: s.screen === "result",

      recipientItems: recipientItems,
      toggleMoreRecipients: this.toggleMoreRecipients,
      moreRecipientsLabel: s.showMoreRecipients ? "Less" : "More",

      toneItems: toneItems,
      toggleMoreTones: this.toggleMoreTones,
      moreTonesLabel: s.showMoreTones ? "Less" : "More",

      details: s.details,
      handleDetailsChange: this.handleDetailsChange,
      detailsCount: detailsLen,
      detailsCounterColor: detailsLen > 500 ? "#B3492F" : "#6B655C",

      isNotReady: isNotReady,
      generateOpacity: isNotReady ? "0.45" : "1",
      generatePointerEvents: isNotReady ? "none" : "auto",
      handleGenerate: this.handleGenerate,

      generatingText: "Writing a " + toneObj.label.toLowerCase() + " letter to your " + recipientObj.label.toLowerCase(),
      goBackToSetup: this.goBackToSetup,

      toneName: toneObj.label,
      toggleToneSwitcher: this.toggleToneSwitcher,
      toneSwitcherOpen: s.toneSwitcherOpen,
      toneChevronRotation: s.toneSwitcherOpen ? 180 : 0,
      quickToneItems: quickToneItems,

      regeneratePhrasing: this.regeneratePhrasing,

      editingBool: s.editing,
      notEditingBool: !s.editing,
      editText: s.editText,
      handleEditChange: this.handleEditChange,
      startEdit: this.startEdit,
      cancelEdit: this.cancelEdit,
      saveEdit: this.saveEdit,

      hasCustomText: hasCustomText,
      noCustomText: !hasCustomText,
      customText: s.customText || "",
      letterParagraphs: letterParagraphs,
      signoffText: this.signoffs[s.tone] || "Yours truly,",

      handleCopy: this.handleCopy,
      copiedBool: s.copied,

      toggleShare: this.toggleShare,
      closeShare: this.closeShare,
      shareOpenBool: s.shareOpen
    };
  }
}
</script>
</body>
</html>
